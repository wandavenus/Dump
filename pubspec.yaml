name: musicplayer
description: "A new Flutter project."
publish_to: 'none'
version: 1.3.3

environment:
  sdk: '>=3.12.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  text_scroll: ^0.2.1
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  cached_network_image: ^3.4.1
  audio_session: ^0.2.3
  permission_handler: ^12.0.3
  shared_preferences: ^2.5.3
  rxdart: ^0.28.0
  path: ^1.9.0
  path_provider: ^2.1.5
  scrollable_positioned_list: ^0.3.8
  palette_generator_plus: ^1.0.0

  native_audio_runtime:
    path: native_audio_runtime
  url_launcher: ^6.3.2
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/play_store_512.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/play_store_512.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/search/

  shaders:
    - assets/shaders/fluid.frag

  fonts:
    - family: SF Pro Text
      fonts:
        - asset: assets/fonts/sf_pro_text_regular.otf
        - asset: assets/fonts/sf_pro_text_medium.otf
          weight: 500
        - asset: assets/fonts/sf_pro_text_semibold.otf
          weight: 600
        - asset: assets/fonts/sf_pro_text_bold.otf
          weight: 700
        - asset: assets/fonts/sf_pro_text_black.otf
          weight: 900
