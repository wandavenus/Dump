name: Flutter Check

on:
  push:
    branches: [main, backup, modernize/**]
  pull_request:
  workflow_dispatch:

concurrency:
  group: flutter-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Reclaim runner disk space
        run: |
          echo "Disk usage before cleanup:"
          df -h /
          sudo du -sh /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL 2>/dev/null || true

          # Remove preinstalled SDKs/tool caches not used by this Flutter Android build.
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android/sdk/ndk

          echo "Disk usage after cleanup:"
          df -h /

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Version
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Assemble Debug
        working-directory: android
        run: ./gradlew assembleDebug
