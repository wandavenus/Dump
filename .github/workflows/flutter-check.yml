name: Flutter Check

# N3 fix: previously dispatch-only — the lint + debug-assemble check never
# ran automatically. Now runs on push/PR touching app code.
on:
  push:
    paths:
      - 'android/**'
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/flutter-check.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/flutter-check.yml'
  workflow_dispatch:

concurrency:
  group: flutter-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Version
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Lint url_launcher_android
        working-directory: android
        env:
         LINT_PRINT_STACKTRACE: "true"
        run: |
         ./gradlew \
         :url_launcher_android:lintVitalAnalyzeRelease \
         --stacktrace \
         --info

      - name: Assemble Debug
        working-directory: android
        run: ./gradlew assembleDebug
