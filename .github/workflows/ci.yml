name: CI checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Flutter + Android tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect Dart source changes
        id: source-changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          if git diff --name-only "$BASE_SHA" HEAD | grep -Eq '^(lib|test)/.*[.]dart$'; then
            echo "dart_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "dart_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate native build scripts
        run: |
          bash -n android/build-ffmpeg-jni.sh
          bash -n scripts/ci/install-android-ndk.sh

      - name: Install pinned Android NDK
        run: bash scripts/ci/install-android-ndk.sh

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart / Flutter
        run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos

      - name: Run Flutter tests
        if: ${{ steps.source-changes.outputs.dart_changed != 'true' }}
        run: flutter test --no-pub

      - name: Run Android unit tests (Kotlin DSP)
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build debug APK including FFmpeg JNI
        if: ${{ steps.source-changes.outputs.dart_changed != 'true' }}
        run: flutter build apk --debug --target-platform android-arm64 --no-pub

      - name: Verify FFmpeg JNI and license notices are packaged
        if: ${{ steps.source-changes.outputs.dart_changed != 'true' }}
        working-directory: android
        run: |
          APK="../build/app/outputs/flutter-apk/app-debug.apk"
          test -f "$APK"
          unzip -Z -1 "$APK" | grep -Fx "lib/arm64-v8a/libffmpegJNI.so"
          unzip -Z -1 "$APK" | grep -Fx "assets/licenses/COPYING.LGPLv2.1"
          unzip -Z -1 "$APK" | grep -Fx "assets/licenses/LICENSE-2.0.txt"
          unzip -Z -1 "$APK" | grep -Fx "assets/licenses/THIRD_PARTY_NOTICES.txt"
