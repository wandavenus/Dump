name: Jetpack Compose Android Build

on:
  push:
    branches:
      - migrate-to-jetpack-compose-16098015074931029028
    paths:
      - 'android_compose/**'
      - 'native_audio_runtime/**'
  pull_request:
    branches:
      - migrate-to-jetpack-compose-16098015074931029028
    paths:
      - 'android_compose/**'
      - 'native_audio_runtime/**'
  workflow_dispatch:

concurrency:
  group: compose-android-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-compose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: never

      - name: Build Compose release APK
        working-directory: android_compose
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
