name: Jetpack Compose Android Build

on:
  push:
    branches:
      - main
    paths:
      - 'android_compose/**'
      - 'native_audio_runtime/**'
  pull_request:
    branches:
      - main
    paths:
      - 'android_compose/**'
      - 'native_audio_runtime/**'
  workflow_dispatch:

concurrency:
  group: compose-android-build
  cancel-in-progress: true

jobs:
  build-compose:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Compose Release APK
        run: |
          cd android_compose
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Compose APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dump-Compose-Release-APK
          path: android_compose/app/build/outputs/apk/release/*.apk
