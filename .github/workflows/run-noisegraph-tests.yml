name: Run Noisegraph Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      suite:
        description: "Which test workflow to dispatch in Noisegraph"
        required: true
        type: choice
        default: all
        options:
          - all
          - flutter
          - automix-dart
          - native-c
          - kotlin
          - android-arm64

permissions:
  contents: read

jobs:
  dispatch-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR source for setup-script validation
        uses: actions/checkout@v7

      - name: Validate Flutter setup script syntax
        run: bash -n setup-flutter.sh

      - name: Validate selected Dump revision
        id: source
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          TEST_SUITE: ${{ inputs.suite || 'all' }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::GitHub did not provide a valid source commit SHA."
            exit 1
          fi
          {
            echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
            echo "ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
            echo "suite=$TEST_SUITE" >> "$GITHUB_OUTPUT"
            echo "## Noisegraph test dispatch"
            echo
            echo "- Suite: $TEST_SUITE"
            echo "- Dump ref: $SOURCE_REF"
            echo "- Dump commit: $SOURCE_SHA"
            echo "- Triggered by: @${{ github.actor }}"
            echo
            echo "Dispatch acceptance starts separate runs in https://github.com/wandavenus/Noisegraph/actions"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch Flutter analyze and full tests
        if: ${{ steps.source.outputs.suite == 'all' || steps.source.outputs.suite == 'flutter' }}
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.BUILDER_DISPATCH_TOKEN }}
          repository: wandavenus/Noisegraph
          event-type: test-flutter
          client-payload: '{"sha":"${{ steps.source.outputs.sha }}","ref":"${{ steps.source.outputs.ref }}","suite":"flutter"}'

      - name: Dispatch AutoMix Dart regression tests
        if: ${{ steps.source.outputs.suite == 'all' || steps.source.outputs.suite == 'automix-dart' }}
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.BUILDER_DISPATCH_TOKEN }}
          repository: wandavenus/Noisegraph
          event-type: test-automix-dart
          client-payload: '{"sha":"${{ steps.source.outputs.sha }}","ref":"${{ steps.source.outputs.ref }}","suite":"automix-dart"}'

      - name: Dispatch native C/DSP tests
        if: ${{ steps.source.outputs.suite == 'all' || steps.source.outputs.suite == 'native-c' }}
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.BUILDER_DISPATCH_TOKEN }}
          repository: wandavenus/Noisegraph
          event-type: test-native-c
          client-payload: '{"sha":"${{ steps.source.outputs.sha }}","ref":"${{ steps.source.outputs.ref }}","suite":"native-c"}'

      - name: Dispatch Kotlin unit tests
        if: ${{ steps.source.outputs.suite == 'all' || steps.source.outputs.suite == 'kotlin' }}
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.BUILDER_DISPATCH_TOKEN }}
          repository: wandavenus/Noisegraph
          event-type: test-kotlin
          client-payload: '{"sha":"${{ steps.source.outputs.sha }}","ref":"${{ steps.source.outputs.ref }}","suite":"kotlin"}'

      - name: Dispatch Android ARM64 build smoke test
        if: ${{ steps.source.outputs.suite == 'all' || steps.source.outputs.suite == 'android-arm64' }}
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.BUILDER_DISPATCH_TOKEN }}
          repository: wandavenus/Noisegraph
          event-type: test-android-arm64
          client-payload: '{"sha":"${{ steps.source.outputs.sha }}","ref":"${{ steps.source.outputs.ref }}","suite":"android-arm64"}'

  android-build-validation:
    if: ${{ github.event_name == 'pull_request' || inputs.suite == 'all' || inputs.suite == 'android-arm64' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Validate checked-out source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [[ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::Expected $EXPECTED_SHA but checked out $ACTUAL_SHA"
            exit 1
          fi
          echo "Building exact Dump source SHA: $ACTUAL_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK, and CMake
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;28.2.13676358"

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build ARM64 debug APK
        run: flutter build apk --debug --target-platform android-arm64 --no-pub

      - name: Build ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64 --no-pub
