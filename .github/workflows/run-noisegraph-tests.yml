name: Run Noisegraph Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Which test suite to run in Noisegraph"
        required: true
        type: choice
        default: all
        options:
          - all
          - flutter
          - automix-dart
          - native-c
          - kotlin
          - android-arm64

permissions:
  contents: read

jobs:
  dispatch-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dump source for setup-script validation
        uses: actions/checkout@v7

      - name: Validate Flutter setup script syntax
        run: bash -n setup-flutter.sh

      - name: Validate selected Dump revision
        id: source
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
          TEST_SUITE: ${{ inputs.suite || 'all' }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::GitHub did not provide a valid source commit SHA."
            exit 1
          fi
          {
            echo "sha=$SOURCE_SHA"
            echo "ref=$SOURCE_REF"
            echo "suite=$TEST_SUITE"
            echo "payload=$(jq -cn --arg sha "$SOURCE_SHA" --arg ref "$SOURCE_REF" --arg suite "$TEST_SUITE" '{sha:$sha,ref:$ref,suite:$suite}')"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Noisegraph test dispatch"
            echo
            echo "- Suite: $TEST_SUITE"
            echo "- Dump ref: $SOURCE_REF"
            echo "- Dump commit: $SOURCE_SHA"
            echo "- Triggered by: @${{ github.actor }}"
            echo
            echo "One test-suite run will start in https://github.com/wandavenus/Noisegraph/actions"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch selected test suite
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.BUILDER_DISPATCH_TOKEN }}
          repository: wandavenus/Noisegraph
          event-type: test-suite
          client-payload: ${{ steps.source.outputs.payload }}
