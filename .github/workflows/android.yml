name: android build

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'native_audio_runtime/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'

  pull_request:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'native_audio_runtime/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
       
  workflow_dispatch:

concurrency:
  group: android-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: never

      - uses: subosito/flutter-action@v2
        with:
          channel : stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos

      - name: Set Android version
        run: |
          VERSION_NAME=$(sed -n 's/^version: *//p' pubspec.yaml | cut -d+ -f1 | tr -d '\\r')
          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))

          if [ -z "$VERSION_NAME" ]; then
            echo "::error::Unable to read app version from pubspec.yaml"
            exit 1
          fi

          echo "Android versionName: $VERSION_NAME"
          echo "Android versionCode: $VERSION_CODE"

          sed -i "s/^version: .*/version: $VERSION_NAME/" pubspec.yaml
          echo "flutter.versionName=$VERSION_NAME" >> android/local.properties
          echo "flutter.versionCode=$VERSION_CODE" >> android/local.properties

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$ANDROID_STORE_PASSWORD" ]; then
            echo "::error::Release signing secrets are not configured."
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks

          if ! keytool -list \
            -keystore android/app/release-keystore.jks \
            -storetype PKCS12 \
            -storepass "$ANDROID_STORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Decoded keystore cannot be opened with the configured store password/alias."
            exit 1
          fi

          rm -f /tmp/release-key-validation.jks

          if ! keytool -importkeystore \
            -srckeystore android/app/release-keystore.jks \
            -srcstoretype PKCS12 \
            -srcstorepass "$ANDROID_STORE_PASSWORD" \
            -srcalias "$ANDROID_KEY_ALIAS" \
            -srckeypass "$ANDROID_KEY_PASSWORD" \
            -destkeystore /tmp/release-key-validation.jks \
            -deststoretype PKCS12 \
            -deststorepass "ci-validation-only" \
            -destkeypass "ci-validation-only" \
            -noprompt > /dev/null 2>&1; then
            echo "::error::Configured key password cannot unlock the private key."
            exit 1
          fi

          rm -f /tmp/release-key-validation.jks

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release-keystore.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: >
          flutter build apk
          --release
          --target-platform android-arm64
          --no-pub
          --obfuscate
          --split-debug-info=build/debug-info

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/Dump-${{ github.run_number }}.apk

      - name: Get commit info
        id: commit
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "message<<EOF" >> "$GITHUB_OUTPUT"
          git log -1 --pretty=%B >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Upload APK to Draft Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: "Android Build #${{ github.run_number }}"
          draft: true
          body: |
            Run: #${{ github.run_number }}
            Commit: ${{ steps.commit.outputs.sha }}

            ${{ steps.commit.outputs.message }}
          files: build/app/outputs/flutter-apk/Dump-${{ github.run_number }}.apk
