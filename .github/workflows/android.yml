name: android build

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'native_audio_runtime/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'

  pull_request:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'native_audio_runtime/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
       
  workflow_dispatch:

concurrency:
  group: android-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: never

      - uses: subosito/flutter-action@v2
        with:
          channel : stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos

      - name: Build release APK
        run: >
          flutter build apk
          --release
          --target-platform android-arm64
          --no-pub
          --obfuscate
          --split-debug-info=build/debug-info

      - name: Get app version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version: *//p' pubspec.yaml | head -n1)"
          name="${version%%+*}"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/Dump-${{ steps.version.outputs.name }}.apk

      - name: Get commit info
        id: commit
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "message<<EOF" >> "$GITHUB_OUTPUT"
          git log -1 --pretty=%B >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Publish APK Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: "Music Player v${{ steps.version.outputs.name }}"
          draft: false
          body: |
            Version: ${{ steps.version.outputs.name }}
            Commit: ${{ steps.commit.outputs.sha }}

            ${{ steps.commit.outputs.message }}
          files: build/app/outputs/flutter-apk/Dump-${{ steps.version.outputs.name }}.apk
