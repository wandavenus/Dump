name: android build

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'native_audio_runtime/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'

  pull_request:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'native_audio_runtime/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
       
  workflow_dispatch:

concurrency:
  group: android-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: never

      - uses: subosito/flutter-action@v2
        with:
          channel : stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos

      - name: Build release APK
        run: >
          flutter build apk
          --release
          --target-platform android-arm64
          --no-pub
          --obfuscate
          --split-debug-info=build/debug-info

      - name: Get app version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version: *//p' pubspec.yaml | head -n1)"
          name="${version%%+*}"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Generate release notes from changelog
        id: release_notes
        shell: python
        run: |
          import re
          from pathlib import Path

          text = Path("lib/pages/settings_page/changelog_data.dart").read_text(
              encoding="utf-8"
          )

          entry_match = re.search(
              r"_ChangelogEntry\(\s*"
              r"version:\s*'([^']+)'\s*,\s*"
              r"date:\s*'([^']+)'\s*,\s*"
              r"changes:\s*\[(.*?)\]\s*,\s*"
              r"\)",
              text,
              re.DOTALL,
          )
          if not entry_match:
              raise SystemExit("Could not parse the latest changelog entry.")

          version, date, changes_block = entry_match.groups()
          changes = re.findall(r"'((?:\\'|[^'])*)'", changes_block)

          if not changes:
              raise SystemExit("Latest changelog entry has no changes.")

          body_lines = [
              f"## Music Player v{version}",
              "",
              f"**Tanggal:** {date}",
              "",
              "### Perubahan",
              "",
          ]
          body_lines.extend(f"- {change.replace("\\'", "'")}" for change in changes)
          body = "\n".join(body_lines).strip() + "\n"

          Path("release-notes.md").write_text(body, encoding="utf-8")
          print(body)

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/Dump-${{ steps.version.outputs.name }}.apk

      - name: Publish APK Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: "Music Player v${{ steps.version.outputs.name }}"
          draft: false
          body_path: release-notes.md
          files: build/app/outputs/flutter-apk/Dump-${{ steps.version.outputs.name }}.apk
