name: native_audio_runtime
description: >-
  Phase 3 native runtime foundation for the music player: a thin dart:ffi
  bridge to a C lifecycle/version/capability/module-registry library.
  No DSP or FFmpeg processing — architecture only.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.12.2

dependencies:
  ffi: ^2.1.4
  code_assets: ^1.0.0
  hooks: ^1.0.0
  logging: ^1.3.0
  native_toolchain_c: ^0.17.4

dev_dependencies:
  ffigen: ^20.1.1
  flutter_lints: ^6.0.0
  test: ^1.28.0
