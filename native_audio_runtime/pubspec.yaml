name: native_audio_runtime
description: >-
  Phase 4 native DSP core for the music player: dart:ffi bridge to a C
  DSP pipeline (dsp_pipeline.c), gain processor (gain_processor.c), and
  PCM buffer abstraction (audio_buffer.c) on top of the Phase 3 runtime.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  ffi: ^2.1.4
  code_assets: ^1.0.0
  hooks: ^1.0.0
  logging: ^1.3.0
  native_toolchain_c: ^0.17.4

dev_dependencies:
  ffigen: ^20.1.1
  flutter_lints: ^6.0.0
  test: ^1.28.0
