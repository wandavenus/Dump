<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="musicplayer">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>musicplayer</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Prevent v0 runtime from using hash-based URLs as CSS selectors
    (function() {
      var _origQS = Document.prototype.querySelector;
      Document.prototype.querySelector = function(selector) {
        if (typeof selector === 'string' && selector.startsWith('#/')) {
          return null;
        }
        return _origQS.apply(this, arguments);
      };
      var _origQSA = Document.prototype.querySelectorAll;
      Document.prototype.querySelectorAll = function(selector) {
        if (typeof selector === 'string' && selector.startsWith('#/')) {
          return document.createDocumentFragment().querySelectorAll('*'); // empty NodeList
        }
        return _origQSA.apply(this, arguments);
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
