ext {
    // Single source of truth for the Media3 version used by :app and the
    // local :decoder-ffmpeg extension. Keep in sync with the FFmpeg wrapper
    // sources under android/decoder-ffmpeg/src/main/java.
    media3Version = "1.11.1"
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Project.buildDir is deprecated in Gradle 8.2+ and scheduled for removal;
// the layout API is the supported replacement and resolves identically
// (relative to each project's directory).
rootProject.layout.buildDirectory.set(file('../build'))

subprojects {
    layout.buildDirectory.set(rootProject.layout.buildDirectory.dir(name))
}

subprojects {
    project.evaluationDependsOn(':app')
}


tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory.get().asFile
}
