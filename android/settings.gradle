// Google Maven in app/build.gradle. No local :decoder-ffmpeg sub-module is
// needed. The native libffmpegJNI.so is built separately via
// android/build-ffmpeg-jni.sh and placed in
// android/app/src/main/jniLibs/arm64-v8a/.
