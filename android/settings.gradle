pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }
    settings.ext.flutterSdkPath = flutterSdkPath()

    includeBuild("${settings.ext.flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "9.0.1" apply false
    id "org.jetbrains.kotlin.android" version "2.3.20" apply false
}

include ":app"

// Phase 9 — FFmpeg decoder extension (optional, vendored locally).
//
// `androidx.media3:media3-decoder-ffmpeg` is not published to Maven Central;
// it must be built from source against a real Android NDK and dropped in at
// `android/decoder-ffmpeg/` (a standard Gradle library module — see
// `docs/PHASE_9_FFMPEG_DECODER_INTEGRATION.md` for the exact build steps).
// This sandbox has no NDK, so the directory does not exist here. Guarding the
// include on the directory's existence means `flutter build` / `gradle sync`
// keep working with zero changes both here and on any machine that has not
// vendored the module yet — the app simply runs without the FFmpeg fallback
// decoder until someone completes that one-time native build.
if (file("decoder-ffmpeg").exists()) {
    include ":decoder-ffmpeg"
    project(":decoder-ffmpeg").projectDir = file("decoder-ffmpeg")
}
