pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "com.android.application" version "9.3.0" apply false
    id "org.jetbrains.kotlin.plugin.compose" version "2.4.0" apply false
}

