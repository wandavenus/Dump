pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localPropertiesFile = file("local.properties")

        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream {
                properties.load(it)
            }
        }

        def flutterSdkPath = properties.getProperty("flutter.sdk")

        if (flutterSdkPath == null || flutterSdkPath.trim().isEmpty()) {
            flutterSdkPath = System.getenv("FLUTTER_ROOT")
        }

        if (flutterSdkPath == null || flutterSdkPath.trim().isEmpty()) {
            flutterSdkPath = System.getenv("FLUTTER_HOME")
        }

        assert flutterSdkPath != null && !flutterSdkPath.trim().isEmpty() :
                "Flutter SDK not found. Set flutter.sdk in android/local.properties or define FLUTTER_ROOT/FLUTTER_HOME."

        return flutterSdkPath
    }

    settings.ext.flutterSdkPath = flutterSdkPath()

    includeBuild("${settings.ext.flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "9.4.1" apply false
    id "org.jetbrains.kotlin.android" version "2.4.21" apply false
}

include ":app"

// Phase 9 — FFmpeg decoder extension, built in-repo as an LGPL artifact.
// media3-decoder-ffmpeg is not published on any Maven repository, and the
// community prebuilt (org.jellyfin.media3:media3-ffmpeg-decoder) is declared
// GPL-3.0, which conflicts with this app's "All Rights Reserved" LICENSE.
// android/build-ffmpeg-jni.sh produces the AAR from androidx/media source with
// an FFmpeg configuration that has no GPL/version3/nonfree component; the AAR
// is committed under android/decoder-ffmpeg/libs/ so normal builds need no NDK.
// See docs/FFMPEG_DECODER_LGPL.md.
def ffmpegDecoderAar = new File(settingsDir, "decoder-ffmpeg/libs/media3-decoder-ffmpeg-release.aar")
gradle.ext.ffmpegDecoderAarPresent = ffmpegDecoderAar.exists()
if (gradle.ext.ffmpegDecoderAarPresent) {
    include ":decoder-ffmpeg"
} else {
    gradle.logger.lifecycle("FFmpeg decoder AAR not found at ${ffmpegDecoderAar}\n" +
            "  Building without the extension (ALAC/DTS/TrueHD/Vorbis/Opus fall back to MediaCodec).\n" +
            "  Run android/build-ffmpeg-jni.sh to enable it — see docs/FFMPEG_DECODER_LGPL.md.")
}
