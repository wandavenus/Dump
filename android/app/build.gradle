plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
    id "io.sentry.android.gradle" version "6.24.0"
}

def sentryUploadEnabled = [
    System.getenv("SENTRY_AUTH_TOKEN"),
    System.getenv("SENTRY_ORG"),
    System.getenv("SENTRY_PROJECT")
].every { value -> value != null && !value.trim().isEmpty() }

sentry {
    autoInstallation {
        enabled = false // sentry_flutter already supplies the matching native SDK.
    }
    includeProguardMapping = sentryUploadEnabled
    autoUploadProguardMapping = sentryUploadEnabled
    uploadNativeSymbols = sentryUploadEnabled
    autoUploadNativeSymbols = sentryUploadEnabled
    includeNativeSources = false
    includeSourceContext = false
    org = System.getenv("SENTRY_ORG")
    projectName = System.getenv("SENTRY_PROJECT")
    authToken = System.getenv("SENTRY_AUTH_TOKEN")

}

kotlin {
    jvmToolchain(21)
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
def ciSigningConfigured = System.getenv('ANDROID_KEYSTORE_PATH') != null &&
    System.getenv('ANDROID_KEY_ALIAS') != null &&
    System.getenv('ANDROID_KEY_PASSWORD') != null &&
    System.getenv('ANDROID_STORE_PASSWORD') != null
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
}

// Phase 9 — FFmpeg decoder extension built locally as a JNI library.
// androidx.media3:media3-decoder-ffmpeg is NOT published on Maven Central, and
// the Jellyfin prebuilt AAR (GPL v3) is no longer used. The :decoder-ffmpeg
// module compiles the Media3 wrapper (Apache 2.0) and packages
// libffmpegJNI.so built by android/build-ffmpeg-jni.sh from FFmpeg source with
// --disable-gpl (LGPL only).
def media3_version = rootProject.ext.media3Version

android {
    namespace "dev.wndavenz.music"
    compileSdk 36
    ndkVersion "28.2.13676358"

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    lint {
        baseline = file("lint-baseline.xml")
        abortOnError = false // Tetep pasang false ya beb biar gak sensitif error lint-nya
        warningsAsErrors = false
        checkDependencies = false
        xmlReport = true
        htmlReport = true
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
        }
    }

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "dev.wndavenz.music"
        minSdk 29
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        ndk {
            abiFilters "arm64-v8a" // Kunci di sini! Ini yang bikin APK lu cuma bawa mesin arm64
        }

        // The :decoder-ffmpeg module is always on the classpath. Whether the
        // native library actually loads is reported at runtime by
        // FfmpegCapabilityProbe.queryStatus().available.
        buildConfigField "boolean", "MEDIA3_FFMPEG_DECODER_LINKED", "true"

        // Native ReplayGain module (libebur128 + TagLib, fetched via CMake
        // FetchContent — see src/main/cpp/CMakeLists.txt). No prebuilt .so
        // shipped in-tree; the NDK toolchain compiles it from source on
        // first build. Requires a real Android SDK/NDK + CMake install —
        // this cannot be compiled inside the Replit sandbox, only in
        // Android Studio or CI (see .github/workflows/android.yml).
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
                cppFlags "-std=c++17"
                abiFilters "arm64-v8a"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    packaging {
        resources {
            // Keep third-party license and notice files in the APK so users can
            // inspect the notices required by bundled open-source components.
            // Exclude only non-license metadata that can safely be omitted.
            excludes += [
                "META-INF/DEPENDENCIES",
                "META-INF/*.version",
                "META-INF/AL2.0",
                "META-INF/LGPL2.1"
            ]
        }
        // Biar file .so dari v7a atau x86 punya media-kit gak ikut disuntik ke dalem APK lu
        jniLibs {
            excludes += [
                'lib/armeabi-v7a/**',
                'lib/x86/**',
                'lib/x86_64/**'
            ]
        }
    }

    signingConfigs {
        release {
            keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: keystoreProperties['keyAlias']
            keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: keystoreProperties['keyPassword']
            storeFile System.getenv('ANDROID_KEYSTORE_PATH')
                ? file(System.getenv('ANDROID_KEYSTORE_PATH'))
                : (keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null)
            storePassword System.getenv('ANDROID_STORE_PASSWORD') ?: keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            if (ciSigningConfigured || keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            minifyEnabled true
            shrinkResources true
            crunchPngs true
            ndk {
                debugSymbolLevel 'FULL'
            }
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-session:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"
    implementation "androidx.media3:media3-extractor:$media3_version"
    implementation "androidx.media3:media3-inspector:$media3_version"
    implementation "androidx.media3:media3-container:$media3_version"
    // Phase 9 — locally built FFmpeg decoder (ALAC/DTS/TrueHD/Vorbis).
    // Opus intentionally uses the platform MediaCodec/CCodec decoder.
    // The module's libffmpegJNI.so is produced from the pinned FFmpeg source
    // tree by android/build-ffmpeg-jni.sh; arm64-v8a is the only packaged ABI.
    implementation project(':decoder-ffmpeg')

    // Native palette extraction — MMCQ quantization via Android's Palette library.
    // Replaces palette_generator_plus (Dart-side extraction).
    implementation 'androidx.palette:palette:1.1.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit:2.4.20'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:6.4.0'
}
