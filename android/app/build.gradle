plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

kotlin {
    jvmToolchain(21)
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
def ciSigningConfigured = System.getenv('ANDROID_KEYSTORE_PATH') != null &&
    System.getenv('ANDROID_KEY_ALIAS') != null &&
    System.getenv('ANDROID_KEY_PASSWORD') != null &&
    System.getenv('ANDROID_STORE_PASSWORD') != null
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
}

// Phase 9 — FFmpeg decoder extension, built in-repo as an LGPL artifact.
// androidx.media3:media3-decoder-ffmpeg is NOT on any Maven repository, and the
// community prebuilt (org.jellyfin.media3:media3-ffmpeg-decoder) is declared
// GPL-3.0 — incompatible with this app's "All Rights Reserved" LICENSE.
// android/build-ffmpeg-jni.sh builds the Apache-2.0 wrapper from androidx/media
// at the same tag as media3_version below, with FFmpeg configured without
// GPL/version3/nonfree components. See docs/FFMPEG_DECODER_LGPL.md.
def media3_version = "1.11.1"

// android/settings.gradle sets this after checking for the committed AAR.
def ffmpegDecoderPresent =
    gradle.ext.has("ffmpegDecoderAarPresent") && gradle.ext.ffmpegDecoderAarPresent
def allowMissingFfmpegDecoder = project.hasProperty("allowMissingFfmpegDecoder")

android {
    namespace "dev.wndavenz.music"
    compileSdk 36
    ndkVersion "28.2.13676358"

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    lint {
        baseline = file("lint-baseline.xml")
        abortOnError = false // Tetep pasang false ya beb biar gak sensitif error lint-nya
        warningsAsErrors = false
        checkDependencies = false
        xmlReport = true
        htmlReport = true
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
        }
    }

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "dev.wndavenz.music"
        minSdk 27
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        ndk {
            abiFilters "arm64-v8a" // Kunci di sini! Ini yang bikin APK lu cuma bawa mesin arm64
        }

        // True only when the in-repo LGPL decoder AAR is on the classpath.
        // Reported by FfmpegCapabilityProbe and the Dart bridge diagnostics.
        buildConfigField "boolean", "MEDIA3_FFMPEG_DECODER_LINKED", "${ffmpegDecoderPresent}"

        // Native ReplayGain module (libebur128 + TagLib, fetched via CMake
        // FetchContent — see src/main/cpp/CMakeLists.txt). No prebuilt .so
        // shipped in-tree; the NDK toolchain compiles it from source on
        // first build. Requires a real Android SDK/NDK + CMake install —
        // this cannot be compiled inside the Replit sandbox, only in
        // Android Studio or CI (see .github/workflows/android.yml).
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
                cppFlags "-std=c++17"
                abiFilters "arm64-v8a"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    packaging {
        resources {
            excludes += [
                "META-INF/LICENSE*",
                "META-INF/NOTICE*",
                "META-INF/DEPENDENCIES",
                "META-INF/*.version",
                "META-INF/AL2.0",
                "META-INF/LGPL2.1"
            ]
        }
        // Biar file .so dari v7a atau x86 punya media-kit gak ikut disuntik ke dalem APK lu
        jniLibs {
            excludes += [
                'lib/armeabi-v7a/**',
                'lib/x86/**',
                'lib/x86_64/**'
            ]
        }
    }

    signingConfigs {
        release {
            keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: keystoreProperties['keyAlias']
            keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: keystoreProperties['keyPassword']
            storeFile System.getenv('ANDROID_KEYSTORE_PATH')
                ? file(System.getenv('ANDROID_KEYSTORE_PATH'))
                : (keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null)
            storePassword System.getenv('ANDROID_STORE_PASSWORD') ?: keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            if (ciSigningConfigured || keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            minifyEnabled true
            shrinkResources true
            crunchPngs true
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-session:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"
    implementation "androidx.media3:media3-extractor:$media3_version"
    implementation "androidx.media3:media3-inspector:$media3_version"
    implementation "androidx.media3:media3-container:$media3_version"
    // Phase 9 — in-repo LGPL FFmpeg decoder extension (ALAC/DTS/TrueHD/Vorbis/
    // Opus). The AAR is built by android/build-ffmpeg-jni.sh; abiFilters above
    // drops every ABI except arm64-v8a from whatever the AAR carries.
    if (ffmpegDecoderPresent) {
        implementation project(':decoder-ffmpeg')
    }

    // Native palette extraction — MMCQ quantization via Android's Palette library.
    // Replaces palette_generator_plus (Dart-side extraction).
    implementation 'androidx.palette:palette:1.1.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit:2.4.20'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:6.4.0'
}

// Release builds must ship the decoder: the target device has no usable
// platform ALAC decoder, so silently releasing without it ships a player that
// cannot open lossless files. Override deliberately with
// -PallowMissingFfmpegDecoder=true (or the ORG_GRADLE_PROJECT_ equivalent).
tasks.register("verifyFfmpegDecoderAar") {
    doLast {
        if (!ffmpegDecoderPresent && !allowMissingFfmpegDecoder) {
            throw new GradleException(
                "FFmpeg decoder AAR missing: " +
                "android/decoder-ffmpeg/libs/media3-decoder-ffmpeg-release.aar. " +
                "Build it with android/build-ffmpeg-jni.sh <ndk-path> " +
                "(docs/FFMPEG_DECODER_LGPL.md), commit the AAR, or pass " +
                "-PallowMissingFfmpegDecoder=true to release without " +
                "ALAC/DTS/TrueHD support."
            )
        }
    }
}
tasks.matching { it.name == "preReleaseBuild" }.configureEach {
    dependsOn("verifyFfmpegDecoderAar")
}
