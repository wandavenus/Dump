plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Phase 9 — FFmpeg decoder extension (optional, opt-in).
// Set `ffmpegDecoderEnabled=true` in local.properties only after vendoring
// the module at android/decoder-ffmpeg/ (see settings.gradle and
// docs/PHASE_9_FFMPEG_DECODER_INTEGRATION.md). Both guards — the flag AND the
// module actually being included by settings.gradle — must be true, so a
// stale flag left in local.properties can never break a build that doesn't
// have the module vendored.
def ffmpegDecoderEnabled = localProperties.getProperty('ffmpegDecoderEnabled', 'false').toBoolean() &&
        findProject(':decoder-ffmpeg') != null

android {
    namespace "dev.wndavenz.music"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    lint {
        baseline = file("lint-baseline.xml")
        abortOnError = false // Tetep pasang false ya beb biar gak sensitif error lint-nya
        warningsAsErrors = false
        checkDependencies = false
        xmlReport = true
        htmlReport = true
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
        }
    }

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "dev.wndavenz.music"
        minSdk 28
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        ndk {
            abiFilters "arm64-v8a" // 🌟 Kunci di sini! Ini yang bikin APK lu cuma bawa mesin arm64
        }
    }

    packaging {
        resources {
            excludes += [
                "META-INF/LICENSE*",
                "META-INF/NOTICE*",
                "META-INF/DEPENDENCIES",
                "META-INF/*.version",
                "META-INF/AL2.0",
                "META-INF/LGPL2.1"
            ]
        }
        // 🌟 Biar file .so dari v7a atau x86 punya media-kit gak ikut disuntik ke dalem APK lu
        jniLibs {
            excludes += [
                'lib/armeabi-v7a/**',
                'lib/x86/**',
                'lib/x86_64/**'
            ]
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            crunchPngs true
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.10.1'
    implementation 'androidx.media3:media3-session:1.10.1'
    implementation 'androidx.media3:media3-ui:1.10.1'
    implementation 'androidx.media3:media3-extractor:1.10.1'
    implementation 'androidx.media3:media3-container:1.10.1'

    // Phase 9 — see the ffmpegDecoderEnabled guard above. When this is not
    // included, DefaultRenderersFactory's EXTENSION_RENDERER_MODE_ON simply
    // finds no androidx.media3.decoder.ffmpeg.FfmpegAudioRenderer class on the
    // classpath and skips it — Media3's built-in decoders keep working exactly
    // as they do today. No other code in this project depends on this
    // dependency actually being present (FfmpegCapabilityProbe.kt uses
    // reflection precisely so it never needs this to compile).
    if (ffmpegDecoderEnabled) {
        implementation project(':decoder-ffmpeg')
    }

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit:1.9.23'
    testImplementation 'org.mockito:mockito-core:5.3.1'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.1.0'
}
