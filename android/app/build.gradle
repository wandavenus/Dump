plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Phase 9 — FFmpeg decoder extension.
// androidx.media3:media3-decoder-ffmpeg is available on Google Maven and is
// always linked. The native runtime (libffmpegJNI.so) must be built separately
// from Media3 source using android/build-ffmpeg-jni.sh and placed in
// android/app/src/main/jniLibs/arm64-v8a/. Without the .so the AAR class
// (FfmpegLibrary) is on the classpath but isAvailable() returns false at
// runtime — FfmpegCapabilityProbe handles this gracefully and ExoPlayer falls
// back to the platform MediaCodec ALAC decoder automatically.

android {
    namespace "dev.wndavenz.music"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    lint {
        baseline = file("lint-baseline.xml")
        abortOnError = false // Tetep pasang false ya beb biar gak sensitif error lint-nya
        warningsAsErrors = false
        checkDependencies = false
        xmlReport = true
        htmlReport = true
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
        }
    }

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "dev.wndavenz.music"
        minSdk 29
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        ndk {
            abiFilters "arm64-v8a" // 🌟 Kunci di sini! Ini yang bikin APK lu cuma bawa mesin arm64
        }

        // The AAR class (FfmpegLibrary) is always on the classpath via Maven.
        // Whether the native libffmpegJNI.so is present is a runtime concern
        // reported by FfmpegCapabilityProbe.queryStatus().available.
        buildConfigField "boolean", "MEDIA3_FFMPEG_DECODER_LINKED", "true"
    }

    packaging {
        resources {
            excludes += [
                "META-INF/LICENSE*",
                "META-INF/NOTICE*",
                "META-INF/DEPENDENCIES",
                "META-INF/*.version",
                "META-INF/AL2.0",
                "META-INF/LGPL2.1"
            ]
        }
        // 🌟 Biar file .so dari v7a atau x86 punya media-kit gak ikut disuntik ke dalem APK lu
        jniLibs {
            excludes += [
                'lib/armeabi-v7a/**',
                'lib/x86/**',
                'lib/x86_64/**'
            ]
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            crunchPngs true
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.10.1'
    implementation 'androidx.media3:media3-session:1.10.1'
    implementation 'androidx.media3:media3-ui:1.10.1'
    implementation 'androidx.media3:media3-extractor:1.10.1'
    implementation 'androidx.media3:media3-container:1.10.1'

    // Phase 9 — FFmpeg decoder extension for ALAC (and other formats unsupported
    // by platform MediaCodec). The AAR is published on Google Maven and always
    // included. The native libffmpegJNI.so must be built separately; see
    // android/build-ffmpeg-jni.sh. Without the .so the extension is gracefully
    // skipped by FfmpegCapabilityProbe and ExoPlayer falls back to MediaCodec.
    implementation 'androidx.media3:media3-decoder-ffmpeg:1.10.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit:1.9.23'
    testImplementation 'org.mockito:mockito-core:5.3.1'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.1.0'
}
