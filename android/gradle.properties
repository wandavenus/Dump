android.useAndroidX=true
android.enableJetifier=false
kotlin.jvm.target.validation.mode=warning
kotlin.incremental=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
android.enableR8.fullMode=true
# newDsl=false dipertahankan — Flutter Gradle Plugin 3.44.5 masih cast ke
# AbstractAppExtension (DSL lama); menghapus flag ini menyebabkan ClassCastException.
android.newDsl=false
# builtInKotlin=false diperlukan karena AGP 9.0 melarang org.jetbrains.kotlin.android
# diapply secara eksplisit di submodule (audio_session-0.2.x masih melakukannya).
# Keduanya (newDsl + builtInKotlin) harus false sebagai pasangan bypass.
android.builtInKotlin=false
