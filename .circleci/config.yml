version: 2.1

# ──────────────────────────────────────────────────────────────────────────────
# Flutter CI — analyze + test
#
# Uses a machine executor (ubuntu-2204) and installs Flutter stable from the
# official release manifest. The SDK is cached between runs; the pub cache is
# keyed on pubspec.lock for fast dependency restores.
# ──────────────────────────────────────────────────────────────────────────────

executors:
  flutter:
    machine:
      image: ubuntu-2204:current
    resource_class: medium
    environment:
      FLUTTER_HOME: /home/circleci/flutter
      PUB_CACHE: /home/circleci/.pub-cache

jobs:
  analyze-and-test:
    executor: flutter
    steps:
      - checkout

      # ── System dependencies ──────────────────────────────────────────────────
      - run:
          name: Install C compiler (required by native_audio_runtime)
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends clang

      # ── Flutter SDK ──────────────────────────────────────────────────────────
      - restore_cache:
          name: Restore Flutter SDK cache
          keys:
            - v1-flutter-{{ arch }}-

      - run:
          name: Install Flutter (stable)
          command: |
            set -euo pipefail
            if [ ! -x "$FLUTTER_HOME/bin/flutter" ]; then
              echo "▶ Fetching Flutter stable release manifest..."
              curl -fsSL \
                "https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json" \
                -o /tmp/flutter-releases.json

              STABLE_HASH=$(jq -r '.current_release.stable' /tmp/flutter-releases.json)
              ARCHIVE=$(jq -r --arg h "$STABLE_HASH" \
                '[.releases[] | select(.hash == $h and .channel == "stable")] | first | .archive' \
                /tmp/flutter-releases.json)
              echo "▶ Downloading: $ARCHIVE"
              curl -L \
                "https://storage.googleapis.com/flutter_infra_release/releases/$ARCHIVE" \
                -o /tmp/flutter.tar.xz
              tar -xJf /tmp/flutter.tar.xz -C /home/circleci
              rm /tmp/flutter.tar.xz
              echo "✓ Flutter installed at $FLUTTER_HOME"
            else
              echo "✓ Flutter SDK restored from cache"
            fi
            echo 'export PATH="$FLUTTER_HOME/bin:$PATH"' >> "$BASH_ENV"

      - run:
          name: Flutter version
          command: flutter --version

      - save_cache:
          name: Save Flutter SDK cache
          # epoch makes every save unique; restore uses prefix match to pick the
          # most recent saved SDK (so updates are picked up automatically).
          key: v1-flutter-{{ arch }}-{{ epoch }}
          paths:
            - /home/circleci/flutter

      # ── Dart packages ────────────────────────────────────────────────────────
      - restore_cache:
          name: Restore pub cache
          keys:
            - v1-pub-{{ checksum "pubspec.lock" }}
            - v1-pub-

      - run:
          name: flutter pub get
          command: flutter pub get

      - save_cache:
          name: Save pub cache
          key: v1-pub-{{ checksum "pubspec.lock" }}
          paths:
            - /home/circleci/.pub-cache

      # ── Quality gates ────────────────────────────────────────────────────────
      - run:
          name: flutter analyze
          command: flutter analyze

      - run:
          name: flutter test
          command: flutter test --reporter expanded

workflows:
  build-and-test:
    jobs:
      - analyze-and-test
